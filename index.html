:root{
--bg:#07090c;
--panel:#101318;
--panel2:#171b21;
--line:rgba(255,255,255,.08);
--text:#f6f7f8;
--muted:#858d98;
--red:#ff3b30;
--red2:#ff5a36;
--green:#57e389;
--yellow:#ffd60a;
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
background:var(--bg);
color:var(--text);
font-family:Arial,Helvetica,sans-serif;
}

body{
min-height:100vh;
overflow-x:hidden;
}

button,
input{
font-family:inherit;
}

button{
cursor:pointer;
}

.app{
max-width:1200px;
margin:auto;
}

/* HEADER */

header{
height:68px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
position:fixed;
top:0;
left:0;
right:0;
z-index:2000;
background:rgba(7,9,12,.90);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
border-bottom:1px solid var(--line);
}

.logo{
font-size:26px;
font-weight:1000;
font-style:italic;
letter-spacing:5px;
}

.logo span{
color:var(--red);
}

.header-actions{
display:flex;
gap:8px;
}

.icon{
width:42px;
height:42px;
border-radius:50%;
border:1px solid var(--line);
background:var(--panel2);
color:white;
display:grid;
place-items:center;
font-size:18px;
}

/* MAP */

.map-wrap{
position:relative;
height:62vh;
min-height:430px;
margin-top:68px;
}

#map{
width:100%;
height:100%;
background:#101418;
}

.map-top{
position:absolute;
top:18px;
left:18px;
z-index:1000;
display:flex;
gap:8px;
flex-wrap:wrap;
}

.status{
padding:9px 13px;
background:rgba(7,9,12,.92);
border:1px solid var(--line);
border-radius:30px;
font-size:10px;
font-weight:900;
letter-spacing:1px;
}

.status.gps{
color:var(--green);
}

.status.navigation{
color:var(--red);
}

.speed-box{
display:none;
padding:9px 13px;
background:rgba(7,9,12,.92);
border:1px solid rgba(255,59,48,.3);
border-radius:30px;
font-size:10px;
font-weight:900;
}

.speed-box.visible{
display:block;
}

.map-bottom{
position:absolute;
left:15px;
right:15px;
bottom:15px;
z-index:1000;
padding:18px;
border:1px solid var(--line);
border-radius:20px;
background:rgba(8,10,13,.92);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
}

.map-bottom small{
color:var(--red);
font-size:9px;
font-weight:900;
letter-spacing:2px;
}

.map-bottom h1{
margin:6px 0 3px;
font-size:27px;
font-style:italic;
}

.map-bottom p{
margin:0;
color:var(--muted);
font-size:12px;
}

/* NAVIGATION PANEL */

.navigation-panel{
display:none;
position:absolute;
left:15px;
right:15px;
bottom:15px;
z-index:1200;
padding:16px;
border-radius:20px;
background:rgba(8,10,13,.95);
border:1px solid rgba(255,59,48,.35);
box-shadow:0 15px 40px rgba(0,0,0,.35);
}

.navigation-panel.active{
display:block;
}

.navigation-top{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.navigation-label{
color:var(--red);
font-size:9px;
font-weight:900;
letter-spacing:2px;
}

.navigation-distance{
font-size:25px;
font-weight:1000;
}

.navigation-info{
display:flex;
gap:20px;
margin-top:8px;
color:var(--muted);
font-size:10px;
}

.navigation-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:14px;
}

.navigation-actions button{
padding:13px;
border-radius:12px;
border:1px solid var(--line);
background:var(--panel2);
color:white;
font-size:11px;
font-weight:900;
}

.navigation-actions .stop{
background:rgba(255,59,48,.15);
border-color:rgba(255,59,48,.35);
color:#ff8d85;
}

/* MAIN */

main{
padding:25px 18px 60px;
}

margin
