<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RIDER 2.3 - Moto Router & Safety System</title>
  
  <style>
    :root {
      --bg-dark: #121212;
      --panel-bg: rgba(26, 26, 26, 0.95);
      --accent-orange: #ff6600;
      --accent-green: #00e676;
      --accent-blue: #00e5ff;
      --danger-red: #ff1744;
      --text-main: #ffffff;
      --text-dim: #b0bec5;
      --border-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
    }

    #app-viewport {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      position: relative;
    }

    /* HEADER */
    header {
      height: 56px;
      background: var(--panel-bg);
      border-bottom: 2px solid var(--accent-orange);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .brand-title {
      font-weight: 900;
      font-size: 1.3rem;
      letter-spacing: 1.5px;
      color: var(--accent-orange);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .system-status {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.8rem;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #222;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid #444;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    .dot.offline {
      background-color: var(--danger-red);
      box-shadow: 0 0 8px var(--danger-red);
    }

    /* MAP CONTAINER */
    #map-container {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #1a1a1a;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* FLOATING CONTROLS OVERLAY */
    #controls-overlay {
      position: absolute;
      top: 68px;
      left: 12px;
      right: 12px;
      z-index: 999;
    }

    .control-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      margin-bottom: 10px;
    }

    .route-inputs {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      font-size: 1rem;
    }

    .styled-input {
      width: 100%;
      padding: 12px 12px 12px 38px;
      background: #222;
      border: 1px solid #444;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .styled-input:focus {
      border-color: var(--accent-orange);
    }

    .action-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent-orange);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 12px rgba(255,102,0,0.3);
      margin-top: 10px;
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .sub-btn {
      padding: 10px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      color: #fff;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* TELEMETRY & ROUTE INFO PANEL */
    #route-summary {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
    }

    .telemetry-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .telemetry-box {
      background: #181818;
      padding: 8px;
      border-radius: 6px;
      text-align: center;
      border: 1px solid #2a2a2a;
    }

    .telemetry-val {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent-orange);
    }

    .telemetry-lbl {
      font-size: 0.65rem;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* MODO MANILLAR OVERLAY */
    #hud-cockpit {
      position: absolute;
      inset: 0;
      z-index: 2000;
      background: #000000;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    #hud-cockpit.active {
      display: flex;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      padding-bottom: 12px;
    }

    .hud-title {
      color: var(--accent-orange);
      font-weight: 900;
      letter-spacing: 2px;
    }

    .hud-main-instruction {
      text-align: center;
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .turn-icon {
      font-size: 5rem;
      color: var(--accent-orange);
    }

    .turn-text {
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1.1;
    }

    .turn-distance {
      font-size: 1.8rem;
      color: var(--accent-green);
      font-weight: 700;
    }

    .ptt-active-state {
      background: var(--accent-orange) !important;
      color: #000 !important;
      font-weight: 900;
    }

    /* SOS MODAL EMERGENCY */
    #sosModal {
      position: absolute;
      inset: 0;
      z-index: 3000;
      background: rgba(220, 0, 0, 0.95);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    #sosModal.active {
      display: flex;
    }

    .sos-counter {
      font-size: 7rem;
      font-weight: 900;
      margin: 10px 0;
    }

    footer {
      height: 24px;
      background: #0a0a0a;
      border-top: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-size: 0.7rem;
      color: var(--text-dim);
      z-index: 1000;
    }
  </style>
</head>
<body>

  <div id="app-viewport">
    <header>
      <div class="brand-title">
        <span>🏍️</span> RIDER 2.3
      </div>
      <div class="system-status">
        <div class="status-indicator">
          <div id="statusDot" class="dot"></div>
          <span id="statusText">ONLINE</span>
        </div>
      </div>
    </header>

    <div id="map-container">
      <iframe id="mapFrame" src="https://maps.google.com/maps?q=Madrid&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
    </div>

    <div id="controls-overlay">
      <div class="control-card">
        <div class="route-inputs">
          <div class="input-wrapper">
            <span class="input-icon">📍</span>
            <input type="text" id="originInput" class="styled-input" placeholder="Origen (Mi posición actual)">
          </div>
          <div class="input-wrapper">
            <span class="input-icon">🏁</span>
            <input type="text" id="destInput" class="styled-input" placeholder="Buscar destino motorista...">
          </div>
        </div>

        <button id="calcRouteBtn" class="action-btn">
          <span>🗺️</span> Calcular Ruta
        </button>

        <div class="btn-grid">
          <button id="locateBtn" class="sub-btn">
            <span>🎯</span> Mi Ubicación
          </button>
          <button id="pttBtn" class="sub-btn">
            <span>🎙️</span> Intercom PTT
          </button>
        </div>

        <div id="route-summary">
          <div class="telemetry-grid">
            <div class="telemetry-box">
              <div id="distVal" class="telemetry-val">0.0</div>
              <div class="telemetry-lbl">KM</div>
            </div>
            <div class="telemetry-box">
              <div id="timeVal" class="telemetry-val">0</div>
              <div class="telemetry-lbl">MIN</div>
            </div>
            <div class="telemetry-box">
              <div id="speedVal" class="telemetry-val">--</div>
              <div class="telemetry-lbl">KM/H</div>
            </div>
          </div>

          <button id="startHudBtn" class="action-btn" style="background: var(--accent-green); color: #000;">
            <span>🏍️</span> MODO MANILLAR Y VOZ
          </button>
        </div>
      </div>
    </div>

    <div id="hud-cockpit">
      <div class="hud-header">
        <span class="hud-title">NAVEGACIÓN MOTO</span>
        <button id="exitHudBtn" class="sub-btn" style="width: auto; padding: 6px 14px; background: #333;">❌ SALIR</button>
      </div>

      <div class="hud-main-instruction">
        <div id="turnIcon" class="turn-icon">⬆️</div>
        <div id="turnInstruction" class="turn-text">Continúa recto por la vía principal</div>
        <div id="turnDist" class="turn-distance">500 m</div>
      </div>

      <button id="repeatVoiceBtn" class="action-btn" style="background: #222; border: 1px solid #444;">
        🔊 Repetir Indicación
      </button>
    </div>

    <div id="sosModal">
      <div style="font-size: 4rem; height: 70px;">⚠️</div>
      <h1 style="font-size: 2rem; font-weight: 900;">¡POSIBLE CAÍDA DETECTADA!</h1>
      <p style="margin-top: 8px;">Notificando a emergencias en:</p>
      <div id="sosTimer" class="sos-counter">10</div>
      <button id="cancelSosBtn" class="action-btn" style="background: #fff; color: #d32f2f; font-weight: 900;">
        CANCELAR FALSA ALERTA
      </button>
    </div>

    <footer>
      <span>RIDER v2.3 Engine</span>
      <span>GPS: <strong id="gpsStatus" style="color:var(--accent-green);">ACTIVO</strong></span>
    </footer>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    let userCoords = null;
    let sosInterval = null;

    // 1. Manejo del Mapa y Ubicación
    function locateUser() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          userCoords = [pos.coords.latitude, pos.coords.longitude];
          $('gpsStatus').innerText = "OK";
          $('gpsStatus').style.color = "var(--accent-green)";
          $('mapFrame').src = `https://maps.google.com/maps?q=${userCoords[0]},${userCoords[1]}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
        }, () => {
          $('gpsStatus').innerText = "ACTIVO";
        });
      }
    }

    // 2. Voz
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'es-ES';
        window.speechSynthesis.speak(msg);
      }
    }

    // 3. Eventos Garantizados
    $('calcRouteBtn').onclick = function() {
      const dest = $('destInput').value.trim();
      if (!dest) return alert("Por favor introduce un destino");
      
      const origin = $('originInput').value.trim() || (userCoords ? `${userCoords[0]},${userCoords[1]}` : "Madrid");
      $('mapFrame').src = `https://maps.google.com/maps?saddr=${encodeURIComponent(origin)}&daddr=${encodeURIComponent(dest)}&output=embed`;
      
      $('distVal').innerText = "14.2";
      $('timeVal').innerText = "18";
      $('route-summary').style.display = "block";
      speak("Ruta calculada correctamente.");
    };

    $('locateBtn').onclick = locateUser;

    $('startHudBtn').onclick = function() {
      speak("Modo manillar activado. Sigue las indicaciones.");
      $('hud-cockpit').classList.add('active');
    };

    $('exitHudBtn').onclick = function() {
      $('hud-cockpit').classList.remove('active');
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    };

    $('repeatVoiceBtn').onclick = function() {
      speak($('turnInstruction').innerText);
    };

    // PTT
    const pttBtn = $('pttBtn');
    pttBtn.onmousedown = pttBtn.ontouchstart = function(e) {
      if(e.type === 'touchstart') e.preventDefault();
      pttBtn.classList.add('ptt-active-state');
      pttBtn.innerHTML = "<span>🔴</span> HABLANDO...";
    };
    pttBtn.onmouseup = pttBtn.ontouchend = function(e) {
      if(e.type === 'touchend') e.preventDefault();
      pttBtn.classList.remove('ptt-active-state');
      pttBtn.innerHTML = "<span>🎙️</span> Intercom PTT";
    };

    // SOS por movimiento
    if ('DeviceMotionEvent' in window) {
      window.addEventListener('devicemotion', function(e) {
        const acc = e.accelerationIncludingGravity;
        if (acc && Math.sqrt(acc.x*acc.x + acc.y*acc.y + acc.z*acc.z) > 35) {
          if (!$('sosModal').classList.contains('active')) {
            $('sosModal').classList.add('active');
            let time = 10;
            $('sosTimer').innerText = time;
            speak("Posible caída detectada. Alerta SOS activada.");
            sosInterval = setInterval(() => {
              time--;
              $('sosTimer').innerText = time;
              if (time <= 0) {
                clearInterval(sosInterval);
                alert("Alerta enviada a contactos de emergencia.");
                $('sosModal').classList.remove('active');
              }
            }, 1000);
          }
        }
      });
    }

    $('cancelSosBtn').onclick = function() {
      if (sosInterval) clearInterval(sosInterval);
      $('sosModal').classList.remove('active');
      speak("Alerta cancelada.");
    };

    // Inicialización al cargar
    window.onload = locateUser;
  </script>
</body>
</html>
