<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RIDER 2.1 — Motorcycle Routes</title>

<meta name="theme-color" content="#07090c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="RIDER 2.1 — rutas inteligentes para motoristas">

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin="anonymous">

<style>
:root{
  --bg:#07090c;
  --panel:#101318;
  --panel2:#171b21;
  --line:rgba(255,255,255,.08);
  --text:#f6f7f8;
  --muted:#858d98;
  --red:#ff3b30;
  --red2:#ff5a36;
  --green:#57e389;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  overflow-x:hidden;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:1200px;
  margin:auto;
}

/* HEADER */

header{
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:2000;
  background:rgba(7,9,12,.92);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}

.logo{
  font-size:26px;
  font-weight:1000;
  font-style:italic;
  letter-spacing:5px;
}

.logo span{
  color:var(--red);
}

.header-actions{
  display:flex;
  gap:8px;
}

.icon{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--panel2);
  color:white;
  display:grid;
  place-items:center;
  font-size:18px;
}

/* MAP */

.map-wrap{
  position:relative;
  height:62vh;
  min-height:430px;
  margin-top:68px;
  background:#101418;
}

#map{
  width:100%;
  height:100%;
  min-height:430px;
  background:#101418;
}

.map-top{
  position:absolute;
  top:18px;
  left:18px;
  z-index:1000;
}

.status{
  padding:9px 13px;
  background:rgba(7,9,12,.9);
  border:1px solid var(--line);
  border-radius:30px;
  font-size:10px;
  font-weight:900;
  letter-spacing:1px;
}

.status.gps{
  color:var(--green);
}

.status.error{
  color:#ff8f87;
}

.map-bottom{
  position:absolute;
  left:15px;
  right:15px;
  bottom:15px;
  z-index:1000;
  padding:18px;
  border:1px solid var(--line);
  border-radius:20px;
  background:rgba(8,10,13,.92);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.map-bottom small{
  color:var(--red);
  font-size:9px;
  font-weight:900;
  letter-spacing:2px;
}

.map-bottom h1{
  margin:6px 0 3px;
  font-size:27px;
  font-style:italic;
  line-height:1;
}

.map-bottom p{
  margin:0;
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
}

/* MAIN */

main{
  padding:25px 18px 60px;
}

.section{
  margin-bottom:30px;
}

.eyebrow{
  color:var(--red);
  font-size:9px;
  font-weight:900;
  letter-spacing:2px;
}

h2{
  margin:6px 0;
  font-size:24px;
  font-style:italic;
}

.description{
  margin:0;
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

/* BIKES */

.bikes{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:17px;
}

.bike{
  min-height:105px;
  padding:14px;
  text-align:left;
  color:white;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:17px;
  transition:.2s;
}

.bike:hover{
  transform:translateY(-2px);
}

.bike.active{
  border-color:var(--red);
  background:
    linear-gradient(
      145deg,
      rgba(255,59,48,.17),
      rgba(255,59,48,.03)
    ),
    var(--panel);
}

.bike-icon{
  font-size:27px;
  display:block;
  margin-bottom:12px;
}

.bike strong{
  display:block;
  font-size:11px;
}

.bike small{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:9px;
}

/* CONTROLS */

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.control{
  padding:16px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:17px;
}

.control-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.control-title{
  font-size:11px;
  font-weight:900;
}

.value{
  color:var(--red);
  font-size:12px;
  font-weight:900;
}

input[type=range]{
  width:100%;
  height:4px;
  appearance:none;
  -webkit-appearance:none;
  background:#2a2f36;
  border-radius:20px;
}

input[type=range]::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;
  width:19px;
  height:19px;
  border-radius:50%;
  background:#fff;
  border:4px solid var(--red);
}

input[type=range]::-moz-range-thumb{
  width:13px;
  height:13px;
  border-radius:50%;
  background:#fff;
  border:4px solid var(--red);
}

/* MODE */

.mode-selector{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.mode-btn{
  padding:14px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--panel2);
  color:#aeb5bd;
  font-size:12px;
  font-weight:900;
}

.mode-btn.active{
  color:#fff;
  background:var(--red);
  border-color:var(--red);
}

.dest-input{
  width:100%;
  margin-top:10px;
  padding:14px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--panel2);
  color:#fff;
  font-size:13px;
  outline:none;
}

.dest-input:focus{
  border-color:var(--red);
}

/* DISTANCE */

.distance{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin-top:15px;
}

.distance button{
  padding:13px 4px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel2);
  color:#aeb5bd;
  font-size:11px;
  font-weight:900;
}

.distance button.active{
  color:#fff;
  background:var(--red);
  border-color:var(--red);
}

/* OPTIONS */

.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.option{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
}

.option-title{
  font-size:11px;
  font-weight:900;
}

.option-description{
  margin-top:4px;
  color:var(--muted);
  font-size:9px;
}

.switch{
  width:43px;
  height:24px;
  flex:none;
  border-radius:20px;
  background:#292e35;
  position:relative;
}

.switch::after{
  content:"";
  position:absolute;
  width:18px;
  height:18px;
  top:3px;
  left:3px;
  border-radius:50%;
  background:#747b83;
  transition:.2s;
}

.switch.active{
  background:var(--red);
}

.switch.active::after{
  left:22px;
  background:white;
}

/* GENERATE */

.generate{
  width:100%;
  margin-top:22px;
  padding:18px;
  border:0;
  border-radius:16px;
  color:#fff;
  background:linear-gradient(135deg,var(--red),var(--red2));
  font-size:14px;
  font-weight:1000;
  letter-spacing:.7px;
  box-shadow:0 14px 35px rgba(255,59,48,.2);
}

.generate:disabled{
  opacity:.55;
}

.notice{
  display:none;
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:#1b1413;
  border:1px solid rgba(255,59,48,.25);
  color:#ffb0aa;
  font-size:11px;
  line-height:1.45;
}

.loading{
  display:none;
  text-align:center;
  padding:20px;
  color:var(--muted);
  font-size:12px;
}

/* RESULT */

.result{
  display:none;
  margin-top:18px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
}

.result-head{
  padding:20px;
  background:
    linear-gradient(
      135deg,
      rgba(255,59,48,.17),
      transparent
    ),
    var(--panel2);
}

.result-label{
  color:var(--red);
  font-size:9px;
  font-weight:900;
  letter-spacing:2px;
}

.result-name{
  margin:6px 0;
  font-size:25px;
  font-style:italic;
}

.result-subtitle{
  color:var(--muted);
  font-size:11px;
}

.route-selector{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  padding:15px 20px 0;
  background:var(--panel);
}

.route-opt{
  padding:10px 5px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--panel2);
  color:#aeb5bd;
  font-size:11px;
  font-weight:900;
}

.route-opt.active{
  color:#fff;
  background:var(--red);
  border-color:var(--red);
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  margin-top:15px;
}

.stat{
  padding:16px 5px;
  text-align:center;
  border-right:1px solid var(--line);
}

.stat:last-child{
  border:0;
}

.stat strong{
  display:block;
  font-size:16px;
}

.stat span{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:8px;
  text-transform:uppercase;
}

.result-body{
  padding:18px;
}

.score{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.score-title{
  font-size:10px;
  font-weight:900;
}

.score-number{
  color:var(--red);
  font-size:24px;
  font-weight:1000;
}

.bar{
  height:5px;
  margin-top:9px;
  background:#292e35;
  border-radius:20px;
  overflow:hidden;
}

.bar div{
  height:100%;
  width:0;
  background:var(--red);
  transition:1s;
}

.result-buttons{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:9px;
  margin-top:18px;
}

.result-buttons button{
  padding:13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel2);
  color:white;
  font-size:11px;
  font-weight:900;
}

/* LEAFLET */

.leaflet-control-zoom a{
  background:#11151a!important;
  color:white!important;
  border-color:#292e35!important;
}

.leaflet-control-attribution{
  background:rgba(7,9,12,.75)!important;
  color:#9ba2aa!important;
}

.leaflet-control-attribution a{
  color:#c4cad0!important;
}

/* FOOTER */

footer{
  padding:0 20px 35px;
  text-align:center;
  color:#505761;
  font-size:9px;
  letter-spacing:1.5px;
}

/* MOBILE */

@media(max-width:700px){

  .map-wrap{
    height:55vh;
    min-height:400px;
  }

  #map{
    min-height:400px;
  }

  .bikes{
    display:flex;
    overflow-x:auto;
    scrollbar-width:none;
  }

  .bikes::-webkit-scrollbar{
    display:none;
  }

  .bike{
    min-width:125px;
  }

  .controls,
  .options{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .stat:nth-child(1),
  .stat:nth-child(2){
    border-bottom:1px solid var(--line);
  }

  .stat:nth-child(2){
    border-right:0;
  }

  .result-buttons{
    grid-template-columns:1fr;
  }

  .distance{
    grid-template-columns:repeat(5,1fr);
  }
}

@media(max-width:380px){

  .logo{
    font-size:22px;
  }

  .map-bottom h1{
    font-size:23px;
  }

  h2{
    font-size:21px;
  }

}
</style>
</head>

<body>

<div class="app">

<header>

  <div class="logo">
    RIDER<span>.</span>
  </div>

  <div class="header-actions">

    <button
      class="icon"
      id="locateButton"
      title="Mi ubicación">
      📍
    </button>

    <button
      class="icon"
      id="resetButton"
      title="Reiniciar">
      ↻
    </button>

  </div>

</header>


<section class="map-wrap">

  <div id="map"></div>

  <div class="map-top">

    <div
      class="status"
      id="gpsStatus">
      ● GPS NO ACTIVO
    </div>

  </div>

  <div class="map-bottom">

    <small>RIDE DIFFERENT</small>

    <h1>
      ENCUENTRA TU<br>
      PRÓXIMA RUTA.
    </h1>

    <p id="mapText">
      Activa el GPS y deja que RIDER encuentre
      carreteras que merezcan ser conducidas.
    </p>

  </div>

</section>


<main>

<!-- PERFIL -->

<section class="section">

  <div class="eyebrow">
    01 — PERFIL
  </div>

  <h2>
    ¿CON QUÉ VAS A RODAR?
  </h2>

  <p class="description">
    RIDER adapta el estilo de ruta al comportamiento de tu moto.
  </p>

  <div class="bikes">

    <button class="bike active" data-bike="sport">
      <span class="bike-icon">🏁</span>
      <strong>SPORT</strong>
      <small>Curvas / técnica</small>
    </button>

    <button class="bike" data-bike="naked">
      <span class="bike-icon">🏍️</span>
      <strong>NAKED</strong>
      <small>Equilibrada</small>
    </button>

    <button class="bike" data-bike="trail">
      <span class="bike-icon">🧭</span>
      <strong
