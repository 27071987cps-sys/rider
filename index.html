<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RIDER - Curve & Route Planner</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #12151c;
      --panel-card: #1a1e28;
      --border: #262c3a;
      --accent: #ff3b30;
      --accent-glow: rgba(255, 59, 48, 0.25);
      --text: #f0f3f8;
      --text-dim: #7e8b9b;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* HEADER ORIGINAL */
    header { height: 64px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 1000; }
    .brand { font-weight: 900; font-size: 20px; letter-spacing: 3px; display: flex; align-items: center; gap: 8px; }
    .brand span { color: var(--accent); }
    .tag { font-size: 9px; background: rgba(255,59,48,0.15); color: var(--accent); border: 1px solid var(--accent); padding: 2px 6px; border-radius: 4px; font-weight: 800; letter-spacing: 1px; }

    .header-btns { display: flex; gap: 10px; }
    .btn-icon { background: var(--panel-card); border: 1px solid var(--border); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .btn-icon:hover { border-color: var(--accent); }

    /* ESTRUCTURA PRINCIPAL */
    .app-body { display: flex; flex: 1; position: relative; overflow: hidden; }

    /* SIDEBAR ORIGINAL */
    .sidebar { width: 400px; background: var(--panel); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 20px; z-index: 500; overflow-y: auto; }
    
    .block-title { font-size: 10px; font-weight: 800; color: var(--text-dim); letter-spacing: 1.5px; margin-bottom: 10px; text-transform: uppercase; }

    .search-box { position: relative; }
    .input-field { width: 100%; background: var(--panel-card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: #fff; font-size: 13px; outline: none; }
    .input-field:focus { border-color: var(--accent); }

    /* SELECTORES Y TARJETAS ORIGINALES */
    .grid-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .card-opt { background: var(--panel-card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 8px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .card-opt .label { font-size: 11px; font-weight: 800; display: block; }
    .card-opt.active { border-color: var(--accent); background: var(--accent-glow); color: #fff; }

    /* DESLIZADOR Y BOTÓN PRINCIPAL */
    .range-container { background: var(--panel-card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .range-header { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; margin-bottom: 8px; }
    input[type=range] { width: 100%; accent-color: var(--accent); }

    .btn-action { background: var(--accent); color: #fff; border: 0; padding: 16px; border-radius: 10px; font-weight: 900; font-size: 14px; letter-spacing: 1px; cursor: pointer; width: 100%; box-shadow: 0 4px 15px rgba(255,59,48,0.3); }
    .btn-action:hover { opacity: 0.9; }

    /* MAPA */
    #map { flex: 1; background: #000; }

    /* PANEL DE RESULTADOS Y MÉTRICAS */
    .results-card { background: var(--panel-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: none; }
    .metric-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 10px; }
    .metric-box { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; text-align: center; border: 1px solid var(--border); }
    .metric-val { font-size: 20px; font-weight: 900; color: var(--accent); }
    .metric-lbl { font-size: 9px; color: var(--text-dim); font-weight: 700; margin-top: 2px; }

    /* MODAL GARAJE */
    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; place-items: center; padding: 20px; }
    .modal-box { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 100%; max-width: 400px; }

    @media (max-width: 768px) {
      .app-body { flex-direction: column-reverse; }
      .sidebar { width: 100%; height: 55vh; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">RIDER <span>2.0</span> <span class="tag">ASPHALT ACTIVE</span></div>
    <div class="header-btns">
      <button class="btn-icon" id="openUserModal">👤 GARAJE</button>
      <button class="btn-icon" id="locateButton">📍 GPS</button>
    </div>
  </header>

  <div class="app-body">
    <div class="sidebar">
      <div>
        <div class="block-title">DESTINO O TIPO DE RUTA</div>
        <div class="search-box">
          <input type="text" id="destInput" class="input-field" placeholder="Haz clic en el mapa o busca destino...">
        </div>
        <div style="margin-top:10px; display:flex; align-items:center; gap:8px; font-size:12px; background:var(--panel-card); padding:10px; border-radius:8px; border:1px solid var(--border);">
          <input type="checkbox" id="circularCheck" style="accent-color:var(--accent); transform:scale(1.2);"> 
          <label for="circularCheck" style="cursor:pointer;"><strong>🔄 Ruta Circular</strong> (Salida y Llegada aquí)</label>
        </div>
      </div>

      <div>
        <div class="block-title">CONFIGURACIÓN MOTO</div>
        <div class="grid-selector">
          <div class="card-opt active" data-bike="sport"><span class="label">SPORT</span></div>
          <div class="card-opt" data-bike="naked"><span class="label">NAKED</span></div>
          <div class="card-opt" data-bike="trail"><span class="label">TRAIL</span></div>
          <div class="card-opt" data-bike="touring"><span class="label">TOURING</span></div>
          <div class="card-opt" data-bike="custom"><span class="label">CUSTOM</span></div>
          <div class="card-opt" data-bike="supermoto"><span class="label">SUPERMOTO</span></div>
        </div>
      </div>

      <div>
        <div class="block-title">CURVÁMETRO & DISTANCIA</div>
        <div class="range-container">
          <div class="range-header">
            <span>RANGO MÁXIMO</span>
            <span id="distVal" style="color:var(--accent)">250 KM</span>
          </div>
          <input type="range" id="distRange" min="50" max="500" value="250">
        </div>
      </div>

      <button class="btn-action" id="generateButton">GENERAR RUTA</button>

      <div id="notice" style="display:none; background:rgba(255,59,48,0.1); border:1px solid var(--accent); color:#fff; padding:10px; border-radius:8px; font-size:12px;"></div>
      <div id="loading" style="display:none; font-size:12px; text-align:center; color:var(--text-dim);">Calculando trazados de curvas...</div>

      <div id="result" class="results-card">
        <div class="block-title" style="margin-bottom:8px;">ALTERNATVIAS DE RUTA</div>
        <div id="routeSelectorContainer"></div>
        <div class="metric-grid">
          <div class="metric-box">
            <div class="metric-val" id="distanceResult">0 km</div>
            <div class="metric-lbl">DISTANCIA</div>
          </div>
          <div class="metric-box">
            <div class="metric-val" id="timeResult">0h 0m</div>
            <div class="metric-lbl">TIEMPO ESTIMADO</div>
          </div>
        </div>
      </div>
    </div>

    <div id="map"></div>
  </div>

  <!-- MODAL GARAJE -->
  <div id="userModal" class="modal-backdrop">
    <div class="modal-box">
      <h3 id="modalTitle" style="font-size:16px; font-weight:800; margin-bottom:12px;">👤 TU GARAJE</h3>
      
      <div id="authForm">
        <input type="email" id="userEmail" placeholder="Tu Email" class="input-field" style="margin-bottom:10px;">
        <input type="password" id="userPass" placeholder="Contraseña" class="input-field" style="margin-bottom:12px;">
        <button id="loginBtn" class="btn-action" style="padding:12px;">Iniciar Sesión</button>
      </div>
      
      <div id="garageForm" style="display:none;">
        <div style="font-size:11px; color:var(--text-dim); margin-bottom:8px; font-weight:700;">MOTOS GUARDADAS:</div>
        <div id="bikeList"></div>
        <hr style="border-color:var(--border); margin:12px 0;">
        <div style="font-size:11px; font-weight:700; margin-bottom:6px;">AÑADIR NUEVA MOTO:</div>
        <input type="text" id="bikeName" placeholder="Modelo (Ej: Monster 821)" class="input-field" style="margin-bottom:8px;">
        <select id="bikeTypeSelect" class="input-field" style="margin-bottom:12px;">
          <option value="sport">Sport</option>
          <option value="naked">Naked</option>
          <option value="trail">Trail</option>
          <option value="touring">Touring</option>
          <option value="custom">Custom</option>
          <option value="supermoto">Supermoto</option>
        </select>
        <button id="addBikeBtn" class="btn-action" style="background:var(--panel-card); border:1px solid var(--border); padding:10px;">+ Guardar en Garaje</button>
        <button id="logoutBtn" style="width:100%; background:transparent; border:0; color:var(--text-dim); font-size:11px; margin-top:10px; cursor:pointer;">Cerrar Sesión</button>
      </div>
      <button id="closeModalBtn" style="width:100%; background:transparent; border:0; color:#fff; font-size:12px; margin-top:10px; cursor:pointer;">Cerrar</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
  const OSRM = "https://router.project-osrm.org";
  
  // MAPA ESTILO OSCURO CARTO-DB
  const map = L.map("map", { zoomControl: false }).setView([41.3851, 2.1734], 10);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    maxZoom: 19,
    subdomains: 'abcd',
    attribution: '&copy; <a href="https://carto.com/">CARTO</a>'
  }).addTo(map);

  let userPosition = null;
  let userMarker = null;
  let destinationPosition = null;
  let destinationMarker = null;
  let routeLayers = [];
  let generatedRoutes = [];

  let currentUser = JSON.parse(localStorage.getItem("rider_user")) || null;
  let userGarage = JSON.parse(localStorage.getItem("rider_garage")) || [];
  let selectedBike = "sport";
  let selectedDistance = 250;

  const $ = id => document.getElementById(id);

  function updateAuthUI() {
    if(currentUser) {
      $("modalTitle").textContent = "🏍️ GARAJE DE " + currentUser.email.split("@")[0].toUpperCase();
      $("authForm").style.display = "none";
      $("garageForm").style.display = "block";
      renderGarage();
    } else {
      $("modalTitle").textContent = "👤 ACCESO AL GARAJE";
      $("authForm").style.display = "block";
      $("garageForm").style.display = "none";
    }
  }

  function renderGarage() {
    const list = $("bikeList");
    list.innerHTML = "";
    if(!userGarage.length) {
      list.innerHTML = "<span style='font-size:11px; color:var(--text-dim);'>No tienes motos guardadas.</span>";
      return;
    }
    userGarage.forEach((b, idx) => {
      const div = document.createElement("div");
      div.style.cssText = "display:flex; justify-content:space-between; align-items:center; padding:8px; background:var(--panel-card); margin-top:6px; border-radius:6px; font-size:12px; border:1px solid var(--border);";
      div.innerHTML = `<span><strong>${b.name}</strong> (${b.type.toUpperCase()})</span>
        <button onclick="selectGarageBike(${idx})" style="background:var(--accent); color:#fff; border:0; padding:4px 8px; border-radius:4px; font-size:10px; cursor:pointer;">SELECCIONAR</button>`;
      list.appendChild(div);
    });
  }

  window.selectGarageBike = function(idx) {
    const bike = userGarage[idx];
    selectedBike = bike.type;
    document.querySelectorAll(".card-opt").forEach(x => x.classList.toggle("active", x.dataset.bike === bike.type));
    $("userModal").style.display = "none";
    showNotice(`Moto activa: <strong>${bike.name}</strong>`);
  };

  $("loginBtn").addEventListener("click", () => {
    const email = $("userEmail").value.trim();
    if(!email) return alert("Ingresa tu email");
    currentUser = { email };
    localStorage.setItem("rider_user", JSON.stringify(currentUser));
    updateAuthUI();
  });

  $("addBikeBtn").addEventListener("click", () => {
    const name = $("bikeName").value.trim();
    const type = $("bikeTypeSelect").value;
    if(!name) return alert("Escribe el nombre de tu moto");
    userGarage.push({ name, type });
    localStorage.setItem("rider_garage", JSON.stringify(userGarage));
    $("bikeName").value = "";
    renderGarage();
  });

  $("logoutBtn").addEventListener("click", () => {
    currentUser = null;
    localStorage.removeItem("rider_user");
    updateAuthUI();
  });

  $("openUserModal").onclick = () => { updateAuthUI(); $("userModal").style.display = "grid"; };
  $("closeModalBtn").onclick = () => $("userModal").style.display = "none";

  document.querySelectorAll(".card-opt").forEach(card => {
    card.addEventListener("click", () => {
      document.querySelectorAll(".card-opt").forEach(c => c.classList.remove("active"));
      card.classList.add("active");
      selectedBike = card.dataset.bike;
    });
  });

  $("distRange").addEventListener("input", (e) => {
    selectedDistance = e.target.value;
    $("distVal").textContent = selectedDistance + " KM";
  });

  function destinationPoint(origin, bearingDeg, distanceKm) {
    const R = 6371;
    const lat1 = origin.lat * Math.PI / 180, lon1 = origin.lng * Math.PI / 180;
    const b = bearingDeg * Math.PI / 180, d = distanceKm / R;
    const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(b));
    const lon2 = lon1 + Math.atan2(Math.sin(b) * Math.sin(d) * Math.cos(lat1), Math.cos(d) - Math.sin(lat1) * Math.sin(lat2));
    return { lat: lat2 * 180 / Math.PI, lng: ((lon2 * 180 / Math.PI + 540) % 360) - 180 };
  }

  async function osrmRoute(points) {
    const coords = points.map(p => `${p.lng},${p.lat}`).join(";");
    const url = `${OSRM}/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=true`;
    const r = await fetch(url);
    if (!r.ok) throw new Error("Error OSRM");
    const data = await r.json();
    return data.routes[0];
  }

  async function generateRoute() {
    if (!userPosition) {
      showNotice("Ubicando posición GPS...");
      locateUser();
      return;
    }

    const isCircularRoute = $("circularCheck").checked;

    if (!isCircularRoute && !destinationPosition) {
      showNotice("Selecciona un destino en el mapa o marca Ruta Circular.");
      return;
    }

    $("loading").style.display = "block";

    try {
      let waypointsSets = [];
      const radius = selectedDistance * 0.15;

      if (isCircularRoute) {
        waypointsSets = [
          [destinationPoint(userPosition, 45, radius), destinationPoint(userPosition, 180, radius), userPosition],
          [destinationPoint(userPosition, 120, radius), destinationPoint(userPosition, 270, radius), userPosition],
          [destinationPoint(userPosition, 300, radius), destinationPoint(userPosition, 60, radius), userPosition]
        ];
      } else {
        waypointsSets = [
          [destinationPoint(userPosition, 30, radius * 0.5), destinationPosition],
          [destinationPoint(userPosition, 330, radius * 0.5), destinationPosition],
          [destinationPosition]
        ];
      }

      generatedRoutes = [];
      clearRouteLayers();

      for (let i = 0; i < waypointsSets.length; i++) {
        const waypoints = [userPosition, ...waypointsSets[i]];
        try {
          const route = await osrmRoute(waypoints);
          generatedRoutes.push({
            route,
            title: isCircularRoute ? `Circuito ${i+1}` : `Opción ${i+1}`,
            km: (route.distance / 1000).toFixed(0),
            time: Math.round(route.duration / 60)
          });
        } catch (e) {}
      }

      if (!generatedRoutes.length) throw new Error("No se pudo calcular la ruta.");

      renderMultiRouteUI();
      selectRouteOption(0);

    } catch (err) {
      showNotice(err.message);
    } finally {
      $("loading").style.display = "none";
    }
  }

  function clearRouteLayers() {
    routeLayers.forEach(l => map.removeLayer(l));
    routeLayers = [];
  }

  function renderMultiRouteUI() {
    let selectorHTML = `<div style="display:flex; gap:8px; margin-bottom:12px;">`;
    generatedRoutes.forEach((r, idx) => {
      selectorHTML += `
        <button onclick="selectRouteOption(${idx})" id="routeBtn_${idx}" 
          style="flex:1; padding:8px; border:1px solid var(--border); border-radius:8px; background:var(--panel-card); color:#fff; cursor:pointer;">
          <strong>${r.title}</strong><br>
          <small style="color:var(--text-dim);">${r.km} km</small>
        </button>`;
    });
    selectorHTML += `</div>`;
    $("routeSelectorContainer").innerHTML = selectorHTML;
  }

  window.selectRouteOption = function(index) {
    clearRouteLayers();

    generatedRoutes.forEach((rData, idx) => {
      const isSelected = idx === index;
      const layer = L.geoJSON(rData.route.geometry, {
        style: {
          color: isSelected ? "#ff3b30" : "#4a5568",
          weight: isSelected ? 6 : 3,
          opacity: isSelected ? 0.9 : 0.4
        }
      }).addTo(map);

      routeLayers.push(layer);

      const btn = $(`routeBtn_${idx}`);
      if(btn) {
        btn.style.borderColor = isSelected ? "var(--accent)" : "var(--border)";
        btn.style.background = isSelected ? "var(--accent-glow)" : "var(--panel-card)";
      }
    });

    const active = generatedRoutes[index];
    $("distanceResult").textContent = active.km + " km";
    $("timeResult").textContent = Math.floor(active.time/60) + "h " + (active.time%60) + "m";
    $("result").style.display = "block";
    map.fitBounds(routeLayers[index].getBounds(), { padding: [40, 40] });
  };

  function showNotice(msg) {
    $("notice").innerHTML = msg;
    $("notice").style.display = "block";
  }

  function locateUser() {
    if (!navigator.geolocation) return showNotice("GPS no soportado");
    navigator.geolocation.getCurrentPosition(pos => {
      userPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.circleMarker([userPosition.lat, userPosition.lng], { radius: 8, fillColor: "#ff3b30", color: "#fff", weight: 3, fillOpacity: 1 }).addTo(map);
      map.setView([userPosition.lat, userPosition.lng], 11);
      showNotice("📍 GPS listo");
    });
  }

  map.on("click", (e) => {
    destinationPosition = { lat: e.latlng.lat, lng: e.latlng.lng };
    if (destinationMarker) map.removeLayer(destinationMarker);
    destinationMarker = L.marker([destinationPosition.lat, destinationPosition.lng]).addTo(map);
    $("destInput").value = `${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`;
    showNotice("Destino marcado");
  });

  $("locateButton").addEventListener("click", locateUser);
  $("generateButton").addEventListener("click", generateRoute);

  locateUser();
  </script>
</body>
</html>
