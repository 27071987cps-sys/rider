<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RIDER 2.0</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0f1115;
      --panel: #16191f;
      --panel2: #212631;
      --line: #2d3442;
      --red: #ff3b30;
      --text: #f0f2f5;
      --muted: #8a93a0;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    header { height: 60px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 1000; }
    .logo { font-weight: 900; font-size: 18px; letter-spacing: 2px; color: #fff; }
    .logo span { color: var(--red); }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    .icon-btn { background: var(--panel2); border: 1px solid var(--line); color: #fff; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 14px; }

    .main-container { display: flex; flex: 1; position: relative; overflow: hidden; }
    .sidebar { width: 380px; background: var(--panel); border-right: 1px solid var(--line); padding: 20px; display: flex; flex-direction: column; gap: 20px; z-index: 500; overflow-y: auto; }
    .section-title { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 1px; margin-bottom: 8px; }

    .bike-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .bike-card { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; font-size: 11px; font-weight: bold; }
    .bike-card.active { border-color: var(--red); background: rgba(255, 59, 48, 0.15); color: #fff; }

    .input-box { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; width: 100%; color: #fff; font-size: 13px; }
    .btn-main { background: var(--red); color: #fff; border: 0; padding: 14px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; font-size: 14px; }
    .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }

    #map { flex: 1; height: 100%; background: #000; }

    .notice { background: rgba(255,59,48,0.1); border: 1px solid var(--red); color: #fff; padding: 10px; border-radius: 8px; font-size: 12px; display: none; }
    .result-panel { background: var(--panel2); border-radius: 12px; padding: 15px; border: 1px solid var(--line); display: none; }
    .metrics { display: flex; justify-content: space-around; margin-top: 10px; }
    .metric { text-align: center; }
    .metric-val { font-size: 18px; font-weight: bold; color: var(--red); }
    .metric-lbl { font-size: 10px; color: var(--muted); }

    @media (max-width: 768px) {
      .main-container { flex-direction: column-reverse; }
      .sidebar { width: 100%; height: 50vh; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">RIDER <span>2.0</span></div>
    <div class="header-actions">
      <button class="icon-btn" id="openUserModal">👤 Garaje</button>
      <button class="icon-btn" id="locateButton">📍 GPS</button>
    </div>
  </header>

  <div class="main-container">
    <div class="sidebar">
      <div>
        <div class="section-title">CONFIGURACIÓN DE RUTA</div>
        <input type="text" id="destInput" class="input-box" placeholder="Buscar destino...">
        <div style="margin-top:10px; display:flex; align-items:center; gap:8px; font-size:12px;">
          <input type="checkbox" id="circularCheck" style="accent-color:var(--red);"> 
          <label for="circularCheck"><strong>🔄 Ruta Circular</strong> (Origen/Llegada)</label>
        </div>
      </div>

      <div>
        <div class="section-title">TIPO DE MOTO</div>
        <div class="bike-selector">
          <div class="bike-card active" data-bike="sport">SPORT</div>
          <div class="bike-card" data-bike="naked">NAKED</div>
          <div class="bike-card" data-bike="trail">TRAIL</div>
          <div class="bike-card" data-bike="touring">TOURING</div>
          <div class="bike-card" data-bike="custom">CUSTOM</div>
          <div class="bike-card" data-bike="supermoto">SUPERMOTO</div>
        </div>
      </div>

      <div>
        <div class="section-title">DISTANCIA MÁXIMA (KM)</div>
        <input type="range" id="distRange" min="50" max="500" value="250" style="width:100%; accent-color:var(--red);">
        <div style="text-align:right; font-size:12px; color:var(--muted);" id="distVal">250 km</div>
      </div>

      <button class="btn-main" id="generateButton">GENERAR RUTA</button>

      <div id="notice" class="notice"></div>
      <div id="loading" style="display:none; font-size:12px; text-align:center; color:var(--muted);">Calculando mejores rutas...</div>

      <div id="result" class="result-panel">
        <div class="result-head" style="font-size:12px; font-weight:bold; margin-bottom:10px;">OPCIONES:</div>
        <div class="metrics">
          <div class="metric"><div class="metric-val" id="distanceResult">0 km</div><div class="metric-lbl">DISTANCIA</div></div>
          <div class="metric"><div class="metric-val" id="timeResult">0h 0m</div><div class="metric-lbl">TIEMPO ESTIMADO</div></div>
        </div>
      </div>
    </div>

    <div id="map"></div>
  </div>

  <div id="userModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:2000; place-items:center; padding:20px;">
    <div style="background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px; max-width:380px; width:100%;">
      <h3 id="modalTitle" style="margin-top:0; font-size:18px;">👤 Tu Garaje</h3>
      <div id="authForm">
        <input type="email" id="userEmail" placeholder="Tu Email" class="input-box" style="margin-bottom:10px;">
        <input type="password" id="userPass" placeholder="Contraseña" class="input-box" style="margin-bottom:12px;">
        <button id="loginBtn" class="btn-main">Iniciar Sesión</button>
      </div>
      
      <div id="garageForm" style="display:none;">
        <div style="font-size:12px; color:var(--muted); margin-bottom:8px;">Motos registradas:</div>
        <div id="bikeList"></div>
        <hr style="border-color:var(--line); margin:12px 0;">
        <div style="font-size:12px; font-weight:bold; margin-bottom:6px;">Agregar moto:</div>
        <input type="text" id="bikeName" placeholder="Modelo (Ej. MT-09)" class="input-box" style="margin-bottom:8px; font-size:12px;">
        <select id="bikeTypeSelect" class="input-box" style="margin-bottom:12px; font-size:12px;">
          <option value="sport">Sport</option>
          <option value="naked">Naked</option>
          <option value="trail">Trail</option>
          <option value="touring">Touring</option>
          <option value="custom">Custom</option>
          <option value="supermoto">Supermoto</option>
        </select>
        <button id="addBikeBtn" class="btn-main" style="background:var(--panel2); border:1px solid var(--line);">+ Añadir a mi garaje</button>
        <button id="logoutBtn" style="width:100%; padding:8px; background:transparent; color:var(--muted); border:0; font-size:11px; margin-top:8px; cursor:pointer;">Cerrar sesión</button>
      </div>
      <button id="closeModalBtn" style="width:100%; padding:8px; margin-top:8px; background:transparent; color:#fff; border:0; text-decoration:underline; font-size:12px; cursor:pointer;">Cerrar</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
  const OSRM = "https://router.project-osrm.org";
  const map = L.map("map", { zoomControl:true }).setView([41.3851,2.1734], 10);

  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap"
  }).addTo(map);

  let userPosition = null;
  let userMarker = null;
  let destinationPosition = null;
  let destinationMarker = null;
  let routeLayers = [];
  let generatedRoutes = [];

  let currentUser = JSON.parse(localStorage.getItem("rider_user")) || null;
  let userGarage = JSON.parse(localStorage.getItem("rider_garage")) || [];
  let selectedBike = "sport";
  let selectedDistance = 250;

  const $ = id => document.getElementById(id);

  function updateAuthUI() {
    if(currentUser) {
      $("modalTitle").textContent = "🏍️ GARAJE DE " + currentUser.email.split("@")[0].toUpperCase();
      $("authForm").style.display = "none";
      $("garageForm").style.display = "block";
      renderGarage();
    } else {
      $("modalTitle").textContent = "👤 PERFIL DE USUARIO";
      $("authForm").style.display = "block";
      $("garageForm").style.display = "none";
    }
  }

  function renderGarage() {
    const list = $("bikeList");
    list.innerHTML = "";
    if(!userGarage.length) {
      list.innerHTML = "<span style='font-size:11px; color:var(--muted);'>Sin motos en el garaje.</span>";
      return;
    }
    userGarage.forEach((b, idx) => {
      const div = document.createElement("div");
      div.style.cssText = "display:flex; justify-content:space-between; align-items:center; padding:8px; background:var(--panel2); margin-top:6px; border-radius:6px; font-size:12px;";
      div.innerHTML = `<span><strong>${b.name}</strong> (${b.type.toUpperCase()})</span>
        <button onclick="selectGarageBike(${idx})" style="background:var(--red); color:#fff; border:0; padding:4px 8px; border-radius:4px; font-size:10px; cursor:pointer;">Usar</button>`;
      list.appendChild(div);
    });
  }

  window.selectGarageBike = function(idx) {
    const bike = userGarage[idx];
    selectedBike = bike.type;
    document.querySelectorAll(".bike-card").forEach(x => x.classList.toggle("active", x.dataset.bike === bike.type));
    $("userModal").style.display = "none";
    showNotice(`Moto activa: <strong>${bike.name}</strong>`);
  };

  $("loginBtn").addEventListener("click", () => {
    const email = $("userEmail").value.trim();
    if(!email) return alert("Introduce tu email");
    currentUser = { email };
    localStorage.setItem("rider_user", JSON.stringify(currentUser));
    updateAuthUI();
  });

  $("addBikeBtn").addEventListener("click", () => {
    const name = $("bikeName").value.trim();
    const type = $("bikeTypeSelect").value;
    if(!name) return alert("Escribe el nombre de la moto");
    userGarage.push({ name, type });
    localStorage.setItem("rider_garage", JSON.stringify(userGarage));
    $("bikeName").value = "";
    renderGarage();
  });

  $("logoutBtn").addEventListener("click", () => {
    currentUser = null;
    localStorage.removeItem("rider_user");
    updateAuthUI();
  });

  $("openUserModal").onclick = () => { updateAuthUI(); $("userModal").style.display = "grid"; };
  $("closeModalBtn").onclick = () => $("userModal").style.display = "none";

  document.querySelectorAll(".bike-card").forEach(card => {
    card.addEventListener("click", () => {
      document.querySelectorAll(".bike-card").forEach(c => c.classList.remove("active"));
      card.classList.add("active");
      selectedBike = card.dataset.bike;
    });
  });

  $("distRange").addEventListener("input", (e) => {
    selectedDistance = e.target.value;
    $("distVal").textContent = selectedDistance + " km";
  });

  function destinationPoint(origin, bearingDeg, distanceKm) {
    const R = 6371;
    const lat1 = origin.lat * Math.PI / 180, lon1 = origin.lng * Math.PI / 180;
    const b = bearingDeg * Math.PI / 180, d = distanceKm / R;
    const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(b));
    const lon2 = lon1 + Math.atan2(Math.sin(b) * Math.sin(d) * Math.cos(lat1), Math.cos(d) - Math.sin(lat1) * Math.sin(lat2));
    return { lat: lat2 * 180 / Math.PI, lng: ((lon2 * 180 / Math.PI + 540) % 360) - 180 };
  }

  async function osrmRoute(points) {
    const coords = points.map(p => `${p.lng},${p.lat}`).join(";");
    const url = `${OSRM}/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=true`;
    const r = await fetch(url);
    if (!r.ok) throw new Error("Error OSRM");
    const data = await r.json();
    return data.routes[0];
  }

  async function generateRoute() {
    if (!userPosition) {
      showNotice("Ubícate usando el botón GPS.");
      locateUser();
      return;
    }

    const isCircularRoute = $("circularCheck").checked;

    if (!isCircularRoute && !destinationPosition) {
      showNotice("Marca un destino en el mapa o activa 'Ruta Circular'.");
      return;
    }

    const button = $("generateButton");
    button.disabled = true;
    $("loading").style.display = "block";

    try {
      let waypointsSets = [];
      const radius = selectedDistance * 0.15;

      if (isCircularRoute) {
        waypointsSets = [
          [destinationPoint(userPosition, 45, radius), destinationPoint(userPosition, 180, radius), userPosition],
          [destinationPoint(userPosition, 120, radius), destinationPoint(userPosition, 270, radius), userPosition],
          [destinationPoint(userPosition, 300, radius), destinationPoint(userPosition, 60, radius), userPosition]
        ];
      } else {
        waypointsSets = [
          [destinationPoint(userPosition, 30, radius * 0.5), destinationPosition],
          [destinationPoint(userPosition, 330, radius * 0.5), destinationPosition],
          [destinationPosition]
        ];
      }

      generatedRoutes = [];
      clearRouteLayers();

      for (let i = 0; i < waypointsSets.length; i++) {
        const waypoints = [userPosition, ...waypointsSets[i]];
        try {
          const route = await osrmRoute(waypoints);
          generatedRoutes.push({
            route,
            title: isCircularRoute ? `Circuito ${i+1}` : `Opción ${i+1}`,
            km: (route.distance / 1000).toFixed(0),
            time: Math.round(route.duration / 60)
          });
        } catch (e) {}
      }

      if (!generatedRoutes.length) throw new Error("No fue posible calcular las alternativas.");

      renderMultiRouteUI();
      selectRouteOption(0);

    } catch (err) {
      showNotice(err.message);
    } finally {
      button.disabled = false;
      $("loading").style.display = "none";
    }
  }

  function clearRouteLayers() {
    routeLayers.forEach(l => map.removeLayer(l));
    routeLayers = [];
  }

  function renderMultiRouteUI() {
    let selectorHTML = `<div style="display:flex; gap:8px; margin-bottom:12px;" id="routeOptionsContainer">`;
    generatedRoutes.forEach((r, idx) => {
      selectorHTML += `
        <button onclick="selectRouteOption(${idx})" id="routeBtn_${idx}" 
          style="flex:1; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); color:#fff; cursor:pointer;">
          <strong>${r.title}</strong><br>
          <small style="color:var(--muted);">${r.km} km</small>
        </button>`;
    });
    selectorHTML += `</div>`;

    const resultContainer = $("result");
    const existingSelector = $("routeOptionsContainer");
    if(existingSelector) existingSelector.remove();
    
    resultContainer.querySelector(".result-head").insertAdjacentHTML("afterend", selectorHTML);
  }

  window.selectRouteOption = function(index) {
    clearRouteLayers();

    generatedRoutes.forEach((rData, idx) => {
      const isSelected = idx === index;
      const layer = L.geoJSON(rData.route.geometry, {
        style: {
          color: isSelected ? "#ff3b30" : "#747b83",
          weight: isSelected ? 6 : 3,
          opacity: isSelected ? 0.9 : 0.4
        }
      }).addTo(map);

      routeLayers.push(layer);

      const btn = $(`routeBtn_${idx}`);
      if(btn) {
        btn.style.borderColor = isSelected ? "var(--red)" : "var(--line)";
        btn.style.background = isSelected ? "rgba(255,59,48,0.2)" : "var(--panel2)";
      }
    });

    const active = generatedRoutes[index];
    $("distanceResult").textContent = active.km + " km";
    $("timeResult").textContent = Math.floor(active.time/60) + "h " + (active.time%60) + "m";
    $("result").style.display = "block";
    map.fitBounds(routeLayers[index].getBounds(), { padding: [30, 30] });
  };

  function showNotice(msg) {
    $("notice").innerHTML = msg;
    $("notice").style.display = "block";
  }

  function locateUser() {
    if (!navigator.geolocation) return showNotice("GPS no soportado");
    navigator.geolocation.getCurrentPosition(pos => {
      userPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.circleMarker([userPosition.lat, userPosition.lng], { radius: 8, fillColor: "#ff3b30", color: "#fff", weight: 3, fillOpacity: 1 }).addTo(map);
      map.setView([userPosition.lat, userPosition.lng], 11);
      showNotice("📍 GPS listo");
    });
  }

  map.on("click", (e) => {
    destinationPosition = { lat: e.latlng.lat, lng: e.latlng.lng };
    if (destinationMarker) map.removeLayer(destinationMarker);
    destinationMarker = L.marker([destinationPosition.lat, destinationPosition.lng]).addTo(map);
    $("destInput").value = `${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`;
    showNotice("Destino seleccionado");
  });

  $("locateButton").addEventListener("click", locateUser);
  $("generateButton").addEventListener("click", generateRoute);

  locateUser();
  </script>
</body>
</html>
