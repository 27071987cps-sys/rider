<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>RIDER 2.1 — Motorcycle Routes</title>

<meta name="theme-color" content="#07090c">
<meta name="description" content="RIDER 2.1 — rutas inteligentes para motoristas">

<link rel="stylesheet"

<style>
:root{
  --bg:#07090c;
  --panel:#101318;
  --panel2:#171b21;
  --line:rgba(255,255,255,.08);
  --text:#f6f7f8;
  --muted:#858d98;
  --red:#ff3b30;
  --red2:#ff5a36;
  --green:#57e389;
  --yellow:#ffc857;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif
}

body{
  min-height:100vh
}

button,
input{
  font-family:inherit
}

button{
  cursor:pointer
}

.app{
  max-width:1200px;
  margin:auto
}

/* HEADER */

header{
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:1000;
  background:rgba(7,9,12,.86);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line)
}

.logo{
  font-size:26px;
  font-weight:1000;
  font-style:italic;
  letter-spacing:5px
}

.logo span{
  color:var(--red)
}

.header-actions{
  display:flex;
  gap:8px
}

.icon{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--panel2);
  color:white;
  display:grid;
  place-items:center;
  font-size:18px
}

/* MAP */

.map-wrap{
  position:relative;
  height:62vh;
  min-height:430px;
  margin-top:68px
}

#map{
  width:100%;
  height:100%;
  background:#101418
}

.map-top{
  position:absolute;
  top:18px;
  left:18px;
  z-index:500
}

.status{
  padding:9px 13px;
  background:rgba(7,9,12,.88);
  border:1px solid var(--line);
  border-radius:30px;
  font-size:10px;
  font-weight:900;
  letter-spacing:1px
}

.status.gps{
  color:var(--green)
}

.status.test{
  color:var(--yellow)
}

.map-bottom{
  position:absolute;
  left:15px;
  right:15px;
  bottom:15px;
  z-index:500;
  padding:18px;
  border:1px solid var(--line);
  border-radius:20px;
  background:rgba(8,10,13,.92);
  backdrop-filter:blur(18px)
}

.map-bottom small{
  color:var(--red);
  font-size:9px;
  font-weight:900;
  letter-spacing:2px
}

.map-bottom h1{
  margin:6px 0 3px;
  font-size:27px;
  font-style:italic
}

.map-bottom p{
  margin:0;
  color:var(--muted);
  font-size:12px
}

/* MAIN */

main{
  padding:25px 18px 60px
}

.section{
  margin-bottom:30px
}

.eyebrow{
  color:var(--red);
  font-size:9px;
  font-weight:900;
  letter-spacing:2px
}

h2{
  margin:6px 0;
  font-size:24px;
  font-style:italic
}

.description{
  margin:0;
  color:var(--muted);
  font-size:13px;
  line-height:1.5
}

/* BIKES */

.bikes{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:17px
}

.bike{
  min-height:105px;
  padding:14px;
  text-align:left;
  color:white;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:17px;
  transition:.2s
}

.bike:hover{
  transform:translateY(-2px)
}

.bike.active{
  border-color:var(--red);
  background:
  linear-gradient(
    145deg,
    rgba(255,59,48,.17),
    rgba(255,59,48,.03)
  ),
  var(--panel)
}

.bike-icon{
  font-size:27px;
  display:block;
  margin-bottom:12px
}

.bike strong{
  display:block;
  font-size:11px
}

.bike small{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:9px
}

/* CONTROLS */

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.control{
  padding:16px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:17px
}

.control-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px
}

.control-title{
  font-size:11px;
  font-weight:900
}

.value{
  color:var(--red);
  font-size:12px;
  font-weight:900
}
