<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0c"><title>RIDER</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;background:#090a0c;color:#fff;font-family:system-ui,Arial}header{height:62px;display:flex;justify-content:space-between;align-items:center;padding:0 16px}.logo{font-size:28px;font-weight:900;letter-spacing:5px}button,select,input{font:inherit}button{cursor:pointer}#gps{border:1px solid #333;background:#191b20;color:#fff;border-radius:50%;width:42px;height:42px}#map{height:45vh;min-height:320px}.p{padding:16px}.muted{color:#9ba1aa}.motos{display:grid;grid-template-columns:1fr 1fr;gap:7px}.moto,.card,.status{background:#15171c;border:1px solid #292d35;border-radius:12px;color:#fff;padding:11px}.moto.on{border-color:#fff}.moto span{display:block;font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.card label{display:flex;justify-content:space-between;font-size:11px;color:#aaa;font-weight:800}.card input{width:100%;accent-color:#fff}.row{display:flex;gap:7px;margin-top:9px}.row input,.row select{flex:1;background:#191c22;color:#fff;border:1px solid #292d35;border-radius:11px;padding:12px}.primary{width:100%;border:0;border-radius:13px;padding:15px;margin-top:10px;background:#fff;color:#090a0c;font-weight:900}.secondary{width:100%;border:1px solid #292d35;border-radius:13px;padding:12px;margin-top:8px;background:#171a20;color:#fff;font-weight:800}.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px;font-size:12px}.route{background:#191c22;border:1px solid #292d35;border-radius:13px;padding:12px;margin-top:8px}.score{float:right;font-size:20px;font-weight:900}.status{margin-top:9px;color:#aaa;font-size:13px}.loc{width:18px;height:18px;border-radius:50%;background:#1677ff;border:3px solid #fff}.dest{width:18px;height:18px;border-radius:50%;background:#111;border:3px solid #fff}
</style></head><body><header><div class="logo">RIDER</div><button id="gps">📍</button></header><div id="map"></div><main class="p"><h1>Tu próxima ruta</h1><p class="muted">Mapa real, GPS y generador de rutas RIDER.</p>
<h3>🏍️ Perfil de moto</h3><div class="motos" id="motos">
<button class="moto on">🏁<span>Sport / Supersport</span></button><button class="moto">🏍️<span>Naked</span></button><button class="moto">🧭<span>Trail / Adventure</span></button><button class="moto">🛣️<span>Touring</span></button><button class="moto">😎<span>Custom / Cruiser</span></button><button class="moto">⚡<span>Supermoto</span></button><button class="moto">🛵<span>Scooter / Maxiscooter</span></button><button class="moto">⚙️<span>Personalizada</span></button></div>
<h3>🎛️ Personalización</h3><div class="grid"><div class="card"><label>🔥 Curvas <output id="curveso">9</output></label><input id="curves" type="range" min="0" max="10" value="9"></div><div class="card"><label>⛰️ Montaña <output id="mounto">7</output></label><input id="mount" type="range" min="0" max="10" value="7"></div><div class="card"><label>🌄 Paisaje <output id="sceneryo">8</output></label><input id="scenery" type="range" min="0" max="10" value="8"></div><div class="card"><label>🌲 Secundarias <output id="secondaryo">9</output></label><input id="secondary" type="range" min="0" max="10" value="9"></div><div class="card"><label>🎢 Diversión <output id="funo">10</output></label><input id="fun" type="range" min="0" max="10" value="10"></div></div>
<div class="row"><select id="dist"><option>100 km</option><option>200 km</option><option selected>250 km</option><option>350 km</option><option>500 km</option></select></div><div class="checks"><label class="card"><input id="high" type="checkbox" checked> Evitar autopistas</label><label class="card"><input id="toll" type="checkbox" checked> Evitar peajes</label><label class="card"><input id="city" type="checkbox"> Evitar ciudades</label><label class="card"><input id="elev" type="checkbox" checked> Buscar desnivel</label></div>
<h3>🏁 Destino</h3><div class="row"><input id="search" placeholder="Ciudad o lugar"><button class="secondary" style="margin:0;width:auto" id="find">Buscar</button></div>
<button class="primary" id="generate">🏍️ GENERAR RUTAS</button><button class="secondary" id="clear">Limpiar</button><div class="status" id="status"><b>Estado:</b> pulsa 📍 o toca el mapa.</div><div id="routes"></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([40.4168,-3.7038],6);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let user=null,dest=null,line=null,acc=null;const s=document.getElementById('status');const icon=(c)=>L.divIcon({className:'',html:'<div class="'+c+'"></div>',iconSize:[18,18],iconAnchor:[9,9]});
function msg(x){s.innerHTML='<b>Estado:</b> '+x}function setPos(p){user={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy};let ll=[user.lat,user.lng];if(!window.um)window.um=L.marker(ll,{icon:icon('loc')}).addTo(map);else um.setLatLng(ll);if(!acc)acc=L.circle(ll,{radius:user.accuracy,color:'#1677ff',fillOpacity:.1}).addTo(map);else{acc.setLatLng(ll);acc.setRadius(user.accuracy)}map.setView(ll,15);msg('GPS activo · precisión '+Math.round(user.accuracy)+' m.')}
document.getElementById('gps').onclick=()=>{if(navigator.geolocation)navigator.geolocation.getCurrentPosition(setPos,()=>msg('Permite la ubicación en Chrome.'),{enableHighAccuracy:true,timeout:15000});else msg('GPS no disponible')};
function destination(ll,name='Destino RIDER'){if(dest)map.removeLayer(dest);dest=L.marker(ll,{icon:icon('dest')}).addTo(map).bindPopup('🏁 '+name).openPopup();msg('Destino seleccionado. Pulsa GENERAR RUTAS.')}map.on('click',e=>destination(e.latlng));
document.getElementById('find').onclick=async()=>{let q=search.value.trim();if(!q)return;msg('Buscando…');try{let a=await (await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(q))).json();if(!a.length)return msg('Lugar no encontrado');destination([+a[0].lat,+a[0].lon],a[0].display_name);map.setView([+a[0].lat,+a[0].lon],13)}catch(e){msg('No se pudo buscar')}};document.querySelectorAll('input[type=range]').forEach(x=>x.oninput=()=>document.getElementById(x.id+'o').value=x.value);document.querySelectorAll('.moto').forEach(x=>x.onclick=()=>{document.querySelectorAll('.moto').forEach(y=>y.classList.remove('on'));x.classList.add('on')});
document.getElementById('generate').onclick=async()=>{if(!user){document.getElementById('gps').click();return msg('Activa primero el GPS.')}if(!dest)return msg('Selecciona un destino.');msg('Generando alternativas…');try{let a=[user.lng,user.lat],b=dest.getLatLng(),u='https://router.project-osrm.org/route/v1/driving/'+a+';'+[b.lng,b.lat]+'?overview=full&geometries=geojson&alternatives=true',d=await (await fetch(u)).json();routes.innerHTML='';d.routes.slice(0,3).forEach((r,i)=>{let km=r.distance/1000,min=Math.round(r.duration/60),score=Math.max(60,Math.min(98,84+i*-4+(+curves.value-5)*1.2+(+fun.value-5)));let el=document.createElement('div');el.className='route';el.innerHTML='<span class="score">'+Math.round(score)+'/100</span><b>🏁 Ruta '+(i+1)+'</b><div>'+km.toFixed(1)+' km · '+min+' min · 🔥 '+(30+curves.value*7)+'% curvas</div><button class="secondary">Ver en mapa</button>';el.querySelector('button').onclick=()=>{if(line)map.removeLayer(line);line=L.geoJSON(r.geometry,{style:{color:'#111',weight:7}}).addTo(map);map.fitBounds(line.getBounds(),{padding:[20,20]});msg('Ruta '+(i+1)+' seleccionada.')};routes.appendChild(el)});msg('Alternativas generadas. Elige una para verla.')}catch(e){msg('Servicio de rutas temporalmente no disponible.')}};
clear.onclick=()=>{if(dest){map.removeLayer(dest);dest=null}if(line){map.removeLayer(line);line=null}routes.innerHTML='';msg('Limpiado.')};
</script></body></html>
